name: fintech
description: "Personal finance: expenses, obligations, reminders."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  dio: ^5.11.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  go_router: ^18.0.2
  intl: ^0.20.3
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  timezone: ^0.11.1
  uuid: ^4.6.0
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
